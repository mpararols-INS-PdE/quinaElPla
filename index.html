<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!--Títol-->
  <title>Quina de Nadal</title>
  <link rel="icon" type="image/png" href="img/icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- App principal: sorteig i accés a generador de cartrons -->
  <main class="app">
    <header class="hero card">
      <div class="brand">
        <img class="brand-logo" src="img/logo horitzontal_INS_PLA.png" alt="Logotip Institut Pla de l'Estany">
        <!--<div class="title">Quina de Nadal</div>-->
      </div>
      <div class="stats">
        <span class="pill" id="remaining">Restants: 90</span>
        <span class="pill" id="drawn-count">Trets: 0</span>
        <div class="top-actions">
          <button class="pill-btn menu-toggle" id="menu-toggle" aria-expanded="false" aria-controls="top-menu" type="button">
            <svg viewBox="0 0 24 24" role="presentation" aria-hidden="true">
              <line x1="4" y1="7" x2="20" y2="7"></line>
              <line x1="4" y1="12" x2="20" y2="12"></line>
              <line x1="4" y1="17" x2="20" y2="17"></line>
            </svg>
            <span class="sr-only">Obre menu</span>
          </button>

          <div class="top-menu" id="top-menu" hidden>
            <div class="menu-field">
              <span>Tema</span>
              <div class="segmented segmented-3" role="group" aria-label="Selector de tema">
                <input type="radio" name="theme-mode" id="theme-opt-auto" value="auto">
                <label for="theme-opt-auto">Auto</label>

                <input type="radio" name="theme-mode" id="theme-opt-dark" value="dark">
                <label for="theme-opt-dark">Fosc</label>

                <input type="radio" name="theme-mode" id="theme-opt-light" value="light">
                <label for="theme-opt-light">Clar</label>
              </div>
            </div>

            <div class="menu-field">
              <span>Funcionament</span>
              <div class="segmented segmented-2" role="group" aria-label="Selector de funcionament">
                <input type="radio" name="play-mode" id="mode-opt-auto" value="random">
                <label for="mode-opt-auto">Auto</label>

                <input type="radio" name="play-mode" id="mode-opt-webcam" value="camera">
                <label for="mode-opt-webcam">Webcam</label>
              </div>
            </div>

            <button class="ghost menu-action" id="reset-btn" type="button">Nova partida</button>
            <a class="ghost link-btn menu-action" href="cartons.html">Genera cartrons</a>
          </div>
        </div>
      </div>
    </header>

    <section class="content-grid">
      <section class="display card">
        <p class="last-number-label"></p>
        <div class="big-number" id="current-number">--</div>

        <section id="random-panel" aria-label="Mode aleatori">
          <div class="controls">
            <button class="primary" id="draw-btn">Treure numero aleatori</button>
          </div>
          <p class="note">Prem espai o el boto per treure un numero.</p>
        </section>

        <section class="camera-panel hidden-panel" id="camera-panel" aria-label="Lectura de numero amb camera">
          <h3 class="camera-title">Mode bombo + OCR</h3>
          <div class="cam-frame">
            <video id="cam-preview" class="cam-preview" playsinline muted aria-label="Vista previa camera"></video>
            <div class="cam-overlay" aria-hidden="true">
              <div class="ocr-target-box"></div>
            </div>
          </div>
          <canvas id="cam-capture" class="cam-capture" width="640" height="480" aria-hidden="true"></canvas>
          <div class="camera-controls">
            <button class="ghost" id="start-cam-btn" type="button">Inicia camera</button>
            <button class="ghost" id="stop-cam-btn" type="button" disabled>Atura camera</button>
            <button class="primary" id="ocr-read-btn" type="button" disabled>Llegeix numero del bombo</button>
          </div>
          <div class="camera-options">
            <label>
              <input type="checkbox" id="ocr-auto-mark">
              Marcat automatic si la confianca es bona
            </label>
          </div>
          <p class="note ocr-status" id="ocr-status">Activa la camera i fes una lectura per suggerir el numero.</p>
          <button class="ghost" id="ocr-confirm-btn" type="button" hidden>Marcar numero suggerit</button>
        </section>

      </section>

      <section class="grid-section card">
        <div class="grid-header">
        </div>
        <div class="grid" id="board"></div>
      </section>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
